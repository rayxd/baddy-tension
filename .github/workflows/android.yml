name: Build Android app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Copy the web app into the Android project
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../baddy-tension.apk

      - uses: actions/upload-artifact@v4
        with:
          name: baddy-tension-apk
          path: baddy-tension.apk

      # Builds from the default branch become the newest release, so this link
      # always downloads the latest app:
      # https://github.com/<owner>/<repo>/releases/latest/download/baddy-tension.apk
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Baddy Tension build ${{ github.run_number }}
          body: Open this page on your Android phone and tap **baddy-tension.apk** to install.
          files: baddy-tension.apk
          make_latest: true
